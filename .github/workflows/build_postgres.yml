name: Build Postgres


# on: workflow_dispatch
on:
  push:
    branches: [dev]

  
env:
  POSTGRES_TAG: REL_19_0


jobs:
  windows-build:
    runs-on: windows-latest

    steps:
    - name: Install dependencies
      run: choco install meson
    
    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}

    - name: Enable Ninja
      uses: ilammy/msvc-dev-cmd@v1.13.0
        
    - name: Build
      run: |
        meson setup build --prefix="$(pwd)/build" --buildtype=release -Dssl=openssl -Dreadline=disabled -Dicu=disabled
        ninja -C build libpq
        ninja -C build install
        ls build/lib

    # - name: Prepare
    #   shell: bash
    #   run: |
    #       mkdir -p sqlite_windows/dll
    #       mkdir sqlite_windows/lib
    #       mkdir sqlite_windows/include
    #       mv sqlite3.dll sqlite_windows/dll
    #       mv sqlite3.lib sqlite_windows/lib
    #       mv sqlite3.h sqlite_windows/include

    # - name: Upload SQLite
    #   uses: actions/upload-artifact@v6
    #   with:
    #     name: sqlite_windows
    #     path: sqlite_windows

    
  linux-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lazypanda07/ubuntu-cxx23:26.04

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y pkg-config libicu-dev bison flex zlib1g-dev

    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}
        
    - name: Build
      run: |
          ./configure --prefix=$(pwd)/build --without-readline
          make -j $(nproc) -C src/interfaces/libpq
          make install -C src/interfaces/libpq
          ls build/lib
      
    # - name: Prepare
    #   run: |
    #       mkdir -p sqlite_linux/lib
    #       mkdir sqlite_linux/include
    #       mv build/libsqlite3.so sqlite_linux/lib
    #       mv build/sqlite3.h sqlite_linux/include

    # - name: Upload SQLite
    #   uses: actions/upload-artifact@v6
    #   with:
    #     name: sqlite_linux
    #     path: sqlite_linux
        

  linux-aarch64-build:
    runs-on: ubuntu-26.04-arm

    steps:
    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}
        
    - name: Build
      run: |
          ./configure --prefix=$(pwd)/build --without-readline
          make -j $(nproc) -C src/interfaces/libpq
          make install -C src/interfaces/libpq
      
    - name: Upload Postgres
      uses: actions/upload-artifact@v6
      with:
        name: postgres_linux_aarch64
        path: build
        

  android-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lazypanda07/ubuntu-cxx23:android

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bison flex

    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}
        
    - name: Build
      run: |
          ./configure --host=aarch64-linux-android --prefix=$(pwd)/build --without-readline
          make -j $(nproc) -C src/interfaces/libpq
          make install -C src/interfaces/libpq
      
    - name: Upload Postgres
      uses: actions/upload-artifact@v6
      with:
        name: postgres_android
        path: build
