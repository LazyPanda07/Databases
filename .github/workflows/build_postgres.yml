name: Build Postgres


# on: workflow_dispatch
on:
  push:
    branches: [dev]

  
env:
  POSTGRES_TAG: REL_19_0


jobs:
  windows-build:
    runs-on: windows-latest

    steps:
    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}

    - name: Enable Ninja
      uses: ilammy/msvc-dev-cmd@v1.13.0
        
    - name: Build
      shell: bash
      run: |
          ./configure --prefix=build --without-readline
          make -j $(nproc)
          make install
          ls build

    # - name: Prepare
