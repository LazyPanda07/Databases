name: Build Postgres


on: workflow_dispatch

  
env:
  POSTGRES_TAG: REL_19_0


jobs:
  windows-build:
    runs-on: windows-latest

    steps:
    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}
        
    - name: Enable CL
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Build
      run: |
        python -m pip install meson ninja
        choco install winflexbison

        git clone https://github.com/openssl/openssl.git
        cd openssl
        perl Configure VC-WIN64A no-shared no-tests --prefix="$(pwd)/../openssl-install"
        nmake
        nmake install_sw
        cd ..

        meson setup build --prefix="$(pwd)/build" --buildtype=release -Dssl=openssl -Dreadline=disabled -Dicu=disabled -Dextra_include_dirs="$(pwd)/openssl-install/include" -Dextra_lib_dirs="$(pwd)/openssl-install/lib"
        ninja -C build libpq
        ninja -C build install
        ls build/lib

    - name: Upload Postgres
      uses: actions/upload-artifact@v6
      with:
        name: postgres_windows
        path: build

    
  linux-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lazypanda07/ubuntu-cxx23:26.04

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y pkg-config libicu-dev bison flex zlib1g-dev

    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}
        
    - name: Build
      run: |
          ./configure --prefix=$(pwd)/build --without-readline
          make -j $(nproc) -C src/interfaces/libpq
          make install -C src/interfaces/libpq
          ls build/lib
      
    - name: Upload Postgres
      uses: actions/upload-artifact@v6
      with:
        name: postgres_linux
        path: build
        

  linux-aarch64-build:
    runs-on: ubuntu-26.04-arm

    steps:
    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}
        
    - name: Build
      run: |
          ./configure --prefix=$(pwd)/build --without-readline
          make -j $(nproc) -C src/interfaces/libpq
          make install -C src/interfaces/libpq
      
    - name: Upload Postgres
      uses: actions/upload-artifact@v6
      with:
        name: postgres_linux_aarch64
        path: build
        

  android-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lazypanda07/ubuntu-cxx23:android

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bison flex

    - name: Get Postgres
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: ${{ env.POSTGRES_TAG }}
        
    - name: Build
      run: |
          ./configure --host=aarch64-linux-android --prefix=$(pwd)/build --without-readline
          make -j $(nproc) -C src/interfaces/libpq
          make install -C src/interfaces/libpq
      
    - name: Upload Postgres
      uses: actions/upload-artifact@v6
      with:
        name: postgres_android
        path: build
