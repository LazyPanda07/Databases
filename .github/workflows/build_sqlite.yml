name: Build SQLite


on: workflow_dispatch

  
env:
  SQLITE_TAG: version-3.54.1


jobs:
  windows-build:
    runs-on: windows-latest

    steps:
    - name: Get SQLite
      uses: actions/checkout@v7
      with:
        repository: sqlite/sqlite
        ref: ${{ env.SQLITE_TAG }}

    - name: Enable NMake
      uses: ilammy/msvc-dev-cmd@v1.13.0
        
    - name: Build
      run: |
          nmake /f Makefile.msc
          nmake /f Makefile.msc sqlite3.c

    - name: Prepare
      shell: bash
      run: |
          mkdir -p sqlite_windows/dll
          mkdir sqlite_windows/lib
          mkdir sqlite_windows/include
          mv sqlite3.dll sqlite_windows/dll
          mv sqlite3.lib sqlite_windows/lib
          mv sqlite3.h sqlite_windows/include

    - name: Upload SQLite
      uses: actions/upload-artifact@v7
      with:
        name: sqlite_windows
        path: sqlite_windows

    
  linux-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lazypanda07/ubuntu-cxx23:26.04

    steps:
    - name: Get SQLite
      uses: actions/checkout@v7
      with:
        repository: sqlite/sqlite
        ref: ${{ env.SQLITE_TAG }}
        
    - name: Build
      run: |
          mkdir build
          cd build
          ../configure
          make -j $(nproc)
          make sqlite3.c -j $(nproc)
          gcc -DSQLITE_THREADSAFE=1 sqlite3.c -shared -O3 -fPIC -lpthread -ldl -o libsqlite3.so
      
    - name: Prepare
      run: |
          mkdir -p sqlite_linux/lib
          mkdir sqlite_linux/include
          mv build/libsqlite3.so sqlite_linux/lib
          mv build/sqlite3.h sqlite_linux/include

    - name: Upload SQLite
      uses: actions/upload-artifact@v7
      with:
        name: sqlite_linux
        path: sqlite_linux
        

  linux-aarch64-build:
    runs-on: ubuntu-26.04-arm

    steps:
    - name: Get SQLite
      uses: actions/checkout@v7
      with:
        repository: sqlite/sqlite
        ref: ${{ env.SQLITE_TAG }}
        
    - name: Build
      run: |
          mkdir build
          cd build
          ../configure
          make -j $(nproc)
          make sqlite3.c -j $(nproc)
          cc -DSQLITE_THREADSAFE=1 sqlite3.c -shared -O3 -fPIC -lpthread -ldl -o libsqlite3.so
      
    - name: Prepare
      run: |
          mkdir -p sqlite_linux_aarch64/lib
          mkdir sqlite_linux_aarch64/include
          mv build/libsqlite3.so sqlite_linux_aarch64/lib
          mv build/sqlite3.h sqlite_linux_aarch64/include

    - name: Upload SQLite
      uses: actions/upload-artifact@v7
      with:
        name: sqlite_linux_aarch64
        path: sqlite_linux_aarch64
        

  android-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lazypanda07/ubuntu-cxx23:android

    steps:
    - name: Build
      run: |
        wget -O CMakeLists.txt https://pastebin.com/raw/RWw571SP
        mkdir build
        cd build
        ../configure
        make -j $(nproc)
        make sqlite3.c -j $(nproc)
        export CC=${ANDROID_CROSS_COMPILER_CC}
        export CXX=${ANDROID_CROSS_COMPILER_CXX}
        cmake -DCMAKE_INSTALL_PREFIX=../sqlite_android ${ANDROID_CMAKE_BUILD_ARGUMENTS} ..
        make install -j $(nproc)

    - name: Upload SQLite
      uses: actions/upload-artifact@v7
      with:
        name: sqlite_android
        path: sqlite_android
