name: Build


on:
  push: 
    branches: [main, dev]


permissions:
  contents: write


jobs:
  windows-build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v7
  
    - name: Enable NMake
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Build
      run: |
          mkdir build 
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_INSTALL_PREFIX=Databases -G "Ninja" ..
          cmake --build . -j
          cmake --install .

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.configuration }}_Windows
        path: build/Databases
  

  linux-build:
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/lazypanda07/ubuntu-cxx23:26.04
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v7
  
    - name: Build
      run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_INSTALL_PREFIX=Databases -G "Ninja" ..
          cmake --build . -j
          cmake --install .

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.configuration }}_Linux
        path: build/Databases


  linux-aarch64-build:
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v7
  
    - name: Build
      run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_INSTALL_PREFIX=Databases -G "Ninja" ..
          cmake --build . -j
          cmake --install .

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.configuration }}_LinuxARM
        path: build/Databases


  android-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lazypanda07/ubuntu-cxx23:android
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v7

    - name: Build
      run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} ${ANDROID_CMAKE_BUILD_ARGUMENTS} -DCMAKE_INSTALL_PREFIX=Databases -G "Ninja" ..
          cmake --build . -j
          cmake --install .

    - name: Move
      working-directory: build/Databases
      run: |
          cd lib
          mkdir arm64-v8a
          mv *.so arm64-v8a
          rm -rf *.a
          rm -rf vendor

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.configuration }}_Android
        path: build/Databases


  windows-tests:
    runs-on: windows-latest
    needs: windows-build
    strategy:
      matrix:
        configuration: [Debug, Release]

    env:
      REDIS_VERSION: 8.0.5
      PGPASSWORD: secret

    steps:
    - uses: actions/checkout@v7
    
    - name: Get Redis
      uses: robinraju/release-downloader@v1.11
      with:
        repository: redis-windows/redis-windows
        extract: true
        tag: ${{ env.REDIS_VERSION }}
        fileName: Redis-${{ env.REDIS_VERSION }}-Windows-x64-msys2.zip
        
    - name: Download artifacts
      uses: actions/download-artifact@v6
      with:
        name: ${{ matrix.configuration }}_Windows
        path: Databases
        
    - name: Enable NMake
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Install wait-for-service[redis]
      run: python -m pip install wait-for-service[redis]

    - name: Start Postgres
      run: |
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17

    - name: Check Postgres
      run: |
        & "$env:PGBIN\pg_isready.exe" -h localhost -p 5432

        if ($LASTEXITCODE -ne 0) {
          throw "PostgreSQL is not ready"
        }

    - name: Initialize database
      run: |
          & "$env:PGBIN\createdb.exe" -h localhost -U postgres test
          
    - name: Build tests
      working-directory: Tests
      run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -G "Ninja" ..
          cmake --build . -j
          cmake --install .

    - name: Tests
      working-directory: Tests/build/bin
      shell: cmd
      run: |
          start ${{ github.workspace }}\Redis-${{ env.REDIS_VERSION }}-Windows-x64-msys2\redis-server --port 8080 --requirepass password
          wait-for-service redis://localhost:8080
          .\Tests.exe


  linux-tests:
    runs-on: ubuntu-latest
    needs: linux-build
    container:
      image: ghcr.io/lazypanda07/ubuntu-cxx23:26.04
    strategy:
      matrix:
        configuration: [Debug, Release]

    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: postgres

    steps:
    - uses: actions/checkout@v7

    - name: Install Redis
      run: |
        sudo apt update
        sudo apt install -y redis-server

    - name: Download artifacts
      uses: actions/download-artifact@v6
      with:
        name: ${{ matrix.configuration }}_Linux
        path: Databases
        
    - name: Install wait-for-service[redis]
      run: python3 -m pip install wait-for-service[redis]

    - name: Build tests
      working-directory: Tests
      run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -G "Ninja" ..
          cmake --build . -j
          cmake --install .

    - name: Tests
      working-directory: Tests/build/bin
      run: |
          redis-server --port 8080 --requirepass password & sleep 1
          wait-for-service redis://localhost:8080
          LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:$(pwd) ./Tests


  linux-aarch64-tests:
    runs-on: ubuntu-26.04-arm
    needs: linux-aarch64-build
    strategy:
      matrix:
        configuration: [Debug, Release]

    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7

    - name: Install Redis
      run: |
        sudo apt update
        sudo apt install -y redis-server

    - name: Download artifacts
      uses: actions/download-artifact@v6
      with:
        name: ${{ matrix.configuration }}_LinuxARM
        path: Databases
        
    - name: Build tests
      working-directory: Tests
      run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -G "Ninja" ..
          cmake --build . -j
          cmake --install .

    - name: Install wait-for-service[redis]
      run: python3 -m pip install wait-for-service[redis]

    - name: Tests
      working-directory: Tests/build/bin
      run: |
          redis-server --port 8080 --requirepass password & sleep 1
          wait-for-service redis://localhost:8080
          LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:$(pwd) ./Tests      


  publish:
    needs: [
      windows-tests,
      linux-tests,
      linux-aarch64-tests,
      android-build
    ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Get current branch
      uses : LazyPanda07/extract-current-branch@master
    
    - name: Setup release version variable
      shell: pwsh
      run: echo "VERSION=$($($($(Select-String -Path src\DatabaseUtility.cpp -Pattern version) -split '( = )')[3].TrimEnd(';')).Trim('\"'))" >> $Env:GITHUB_ENV

    - name: Download artifacts
      if: ${{ env.CURRENT_BRANCH == 'main' }}
      uses: actions/download-artifact@v6
      
    - name: Setup Windows build list
      run: echo "WINDOWS_BUILD_LIST="$(ls | grep Windows)"" >> ${GITHUB_ENV}
      
    - name: Create Windows zip
      if: ${{ env.CURRENT_BRANCH == 'main' }}
      run: zip -r windows.zip ${{ env.WINDOWS_BUILD_LIST }}

    - name: Create Linux zip
      if: ${{ env.CURRENT_BRANCH == 'main' }}
      run: zip -r linux.zip Release_Linux

    - name: Create Linux ARM zip
      if: ${{ env.CURRENT_BRANCH == 'main' }}
      run: zip -r linux_aarch64.zip Release_LinuxARM

    - name: Create Android zip
      if: ${{ env.CURRENT_BRANCH == 'main' }}
      run: zip -r android.zip Release_Android

    - name: Publish
      if: ${{ env.CURRENT_BRANCH == 'main' }}
      run: gh release create v${{ env.VERSION }} *.zip --title v${{ env.VERSION }} --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
